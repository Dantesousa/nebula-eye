plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nebula.eye'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nebula.eye'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '0.1.3'
    }

    signingConfigs {
        getByName("debug") {
            storeFile = file("eye-debug.jks")
            storePassword = "android"
            keyAlias = "eyedebug"
            keyPassword = "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
