plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nebula.eye'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nebula.eye'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
